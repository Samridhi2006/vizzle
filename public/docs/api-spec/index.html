<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vizzle API Docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { display: none !important; }
    .docs-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      background: #111827;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    .docs-nav a { color: #fff; text-decoration: none; opacity: 0.85; }
    .docs-nav a:hover { opacity: 1; text-decoration: underline; }
    .docs-nav .brand { font-weight: 700; opacity: 1; margin-right: 8px; }
    .docs-nav .spacer { flex: 1; }
  </style>
</head>
<body>
  <nav class="docs-nav">
    <span class="brand">Vizzle</span>
    <a href="/docs/api">Swagger (Try it out)</a>
    <a href="/docs/api/redoc">ReDoc (Reference)</a>
    <a href="/docs/api/openapi.json">Raw openapi.json</a>
    <span class="spacer"></span>
    <a href="/">vizzle.in</a>
  </nav>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "/docs/api/openapi.json",
      dom_id: "#swagger-ui",
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
      deepLinking: true,
      persistAuthorization: true,
      tryItOutEnabled: true,
      docExpansion: "full"
    });
  </script>
</body>
</html>
